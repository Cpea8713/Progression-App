const KEY='life-ovr-v1';let data;const defaults=()=>({name:'My Player',attributes:[{id:'fitness',name:'Fitness',xp:0},{id:'career',name:'Career',xp:0},{id:'finance',name:'Finance',xp:0},{id:'family',name:'Family',xp:0},{id:'discipline',name:'Discipline',xp:0}],goals:[],history:[]});try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{data=defaults()}if(!Array.isArray(data.attributes)||!Array.isArray(data.goals)||!Array.isArray(data.history))data=defaults();let tab='goals',filter='active';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now()+Math.random()),fmt=n=>Math.round(n).toLocaleString(),save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()},sum=arr=>arr.reduce((s,x)=>s+x,0),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// The cost of each next rating rises exponentially from 50 through 99.
const cost=rating=>Math.round(100*Math.pow(1.115,rating-50));function ratingInfo(xp){let rating=50,remaining=Math.max(0,xp);while(rating<99&&remaining>=cost(rating)){remaining-=cost(rating);rating++}return{rating,remaining,needed:rating===99?0:cost(rating),percent:rating===99?100:100*remaining/cost(rating)}}
let overall=()=>Math.round(sum(data.attributes.map(a=>ratingInfo(a.xp).rating))/Math.max(1,data.attributes.length));const earned=()=>sum(data.history.filter(h=>h.type==='earn').map(h=>h.xp));const goalProgress=g=>{if(!g.steps?.length)return 0;const total=sum(g.steps.map(s=>s.xp));return total?100*sum(g.steps.filter(s=>s.done).map(s=>s.xp))/total:100};const allDone=g=>!g.steps?.length||g.steps.every(s=>s.done);const attr=id=>data.attributes.find(a=>a.id===id);function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast')?.classList.add('hidden'),2400)}function modal(html){$('sheet').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
function render(){const o=overall();$('app').innerHTML=`<div class="panel hero"><div class="ovr"><strong>${o}</strong><small>OVR</small></div><div class="grow"><div class="muted tiny">PLAYER PROFILE</div><h2 style="margin:3px 0 8px">${esc(data.name)}</h2><div class="muted tiny">Your attributes determine your overall rating</div><div class="bar"><div class="fill" style="width:${100*(o-50)/49}%"></div></div><div class="tiny muted">${o===99?'MAX OVR REACHED':`${o-50} of 49 OVR gained`}</div></div></div><div class="grid"><div class="stat"><b>${fmt(earned())}</b><small>Total XP earned</small></div><div class="stat"><b>${data.goals.filter(g=>g.done).length}</b><small>Goals completed</small></div><div class="stat"><b>${data.goals.filter(g=>!g.done).length}</b><small>Active goals</small></div><div class="stat"><b>${data.attributes.length}</b><small>Attributes</small></div></div><div class="tabs">${[['goals','🎯 Goals'],['attributes','📈 Attributes'],['history','🏆 History']].map(([id,n])=>`<button class="tab ${tab===id?'active':''}" onclick="tab='${id}';render()">${n}</button>`).join('')}</div><div id="content"></div>`;if(tab==='goals')renderGoals();if(tab==='attributes')renderAttrs();if(tab==='history')renderHistory()}

function legacyGoalCard(g){const progress=g.done?100:goalProgress(g),a=attr(g.attribute);return `<article class="goal"><div class="flex between"><span class="pill">${esc(a?.name||'Unassigned')}</span><span class="xp">${g.done?'✓ Earned':'🔒 Pending'} ${fmt(g.xp)} XP</span></div><h3>${esc(g.title)}</h3>${g.description?`<div class="muted tiny">${esc(g.description)}</div>`:''}<div class="flex between tiny muted" style="margin-top:12px"><span>${g.steps?.length?`${g.steps.filter(s=>s.done).length}/${g.steps.length} milestones`:'Single task'}</span><span>${Math.round(progress)}%</span></div><div class="bar"><div class="fill" style="width:${progress}%"></div></div>${g.steps?.length?`<div>${g.steps.map(s=>`<div class="sub"><label class="check" style="margin:0"><input type="checkbox" ${s.done?'checked':''} ${g.done?'disabled':''} onchange="toggleStep('${g.id}','${s.id}')"><span style="flex:1;${s.done?'text-decoration:line-through;color:#9cb4c6':''}">${esc(s.title)}</span><span class="xp tiny">${fmt(s.xp)} XP</span></label></div>`).join('')}</div>`:''}<div class="actions">${!g.done?`<button class="btn primary small" ${!allDone(g)?'disabled':''} onclick="finishGoal('${g.id}')">${g.steps?.length?'Claim goal XP':'Complete & earn XP'}</button><button class="btn small" onclick="openGoal('${g.id}')">Edit</button>`:''}<button class="btn small danger" onclick="deleteGoal('${g.id}')">Delete</button></div>${g.steps?.length&&!g.done?'<div class="notice">Milestones track progress only. All XP is awarded when you complete the entire goal.</div>':''}</article>`}
function toggleStep(gid,sid){const g=data.goals.find(g=>g.id===gid);if(!g||g.done)return;const s=g.steps.find(s=>s.id===sid);if(s)s.done=!s.done;save()}function finishGoal(id){const g=data.goals.find(g=>g.id===id);if(!g||g.done||!allDone(g))return;const a=attr(g.attribute);if(!a){alert('Choose an attribute before completing this goal.');return}g.done=true;g.completedAt=new Date().toISOString();a.xp+=g.xp;data.history.unshift({id:uid(),type:'earn',goalId:g.id,title:g.title,attribute:a.name,xp:g.xp,date:g.completedAt});save();toast(`+${fmt(g.xp)} XP earned!`)}function deleteGoal(id){const g=data.goals.find(g=>g.id===id);if(!g||!confirm(`Delete "${g.title}"? ${g.done?'Previously earned XP will remain on your player.':''}`))return;data.goals=data.goals.filter(x=>x.id!==id);save()}
function renderAttrs(){$('content').innerHTML=`<div class="section-title"><h2>Your Attributes</h2><button class="btn primary" onclick="openAttribute()">+ Add</button></div><div class="stack">${data.attributes.map(a=>{const p=ratingInfo(a.xp);return `<div class="goal"><div class="flex between"><div><b>${esc(a.name)}</b><div class="tiny muted">${fmt(a.xp)} total XP</div></div><div class="flex"><b style="font-size:26px;color:#76edc2">${p.rating}</b><span class="tiny muted">OVR</span></div></div><div class="bar"><div class="fill" style="width:${p.percent}%"></div></div><div class="flex between tiny muted"><span>${p.rating===99?'Maxed out':`${fmt(p.remaining)} / ${fmt(p.needed)} XP to next rating`}</span><button class="btn small" onclick="openAttribute('${a.id}')">Rename</button></div></div>`}).join('')}</div><p class="notice">Overall rating is the rounded average of all attribute ratings. Adding a new attribute starts it at 50 and may change your overall rating.</p>`}

let draftSteps=[];function estimatedXP(minutes,difficulty){return Math.max(5,Math.round((10+15*Math.pow(Math.max(1,minutes)/10,.75))*difficulty/5)*5)}function openGoal(id){if(!data.attributes.length)return alert('Create an attribute first.');const g=data.goals.find(x=>x.id===id);draftSteps=(g?.steps||[]).map(s=>({...s}));modal(`<h2>${g?'Edit goal':'Create a goal'}</h2><form onsubmit="submitGoal(event,'${id||''}')"><label>Goal name</label><input id="goalTitle" maxlength="110" required value="${esc(g?.title||'')}" placeholder="What do you want to accomplish?"><label>Description (optional)</label><textarea id="goalDescription" rows="2" maxlength="500" placeholder="Why does this matter?">${esc(g?.description||'')}</textarea><label>Attribute to improve</label><select id="goalAttribute">${data.attributes.map(a=>`<option value="${esc(a.id)}" ${g?.attribute===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select><div class="grid"><div> <label>Timeframe</label> <select id="goalTimeframe" onchange="changeTimeframe()">   <option value="short">Short</option>   <option value="medium">Medium</option>   <option value="long">Long</option> </select>  <div id="shortFields">   <label>Hours</label>   <input id="goalHours" type="number" min="0" value="0" oninput="refreshXP()">   <label>Minutes</label>   <input id="goalMinutes" type="number" min="0" value="${g?.minutes||30}" oninput="refreshXP()"> </div>  <div id="mediumFields" style="display:none">   <label>Days</label>   <input id="goalDays" type="number" min="0" value="0" oninput="refreshXP()"> </div>  <div id="longFields" style="display:none">   <label>Weeks</label>   <input id="goalWeeks" type="number" min="0" value="0" oninput="refreshXP()">   <label>Months</label>   <input id="goalMonths" type="number" min="0" value="0" oninput="refreshXP()">   <label>Years</label>   <input id="goalYears" type="number" min="0" value="0" oninput="refreshXP()"> </div></div><div><label>Difficulty</label><select id="goalDifficulty" onchange="refreshXP()"><option value="0.75" ${g?.difficulty===.75?'selected':''}>Easy</option><option value="1" ${!g||g.difficulty===1?'selected':''}>Normal</option><option value="1.5" ${g?.difficulty===1.5?'selected':''}>Hard</option><option value="2" ${g?.difficulty===2?'selected':''}>Very hard</option></select></div></div><label>Total XP reward (editable)</label><input id="goalXP" type="number" min="1" max="10000000" required value="${g?.xp||estimatedXP(30,1)}" oninput="refreshSteps()"><div class="notice">XP is suggested from estimated time and difficulty. You can override it. For big goals, enter the total time for the whole project.</div><div class="section-title"><h2>Optional milestones</h2><button class="btn small" type="button" onclick="addStep()">+ Add milestone</button></div><div id="stepList"></div><div class="notice" id="stepHint"></div><div class="actions"><button class="btn primary" type="submit">${g?'Save changes':'Create goal'}</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`);refreshSteps()}

function changeTimeframe() {
  const type = $('goalTimeframe').value;

  $('shortFields').style.display = type === 'short' ? 'block' : 'none';
  $('mediumFields').style.display = type === 'medium' ? 'block' : 'none';
  $('longFields').style.display = type === 'long' ? 'block' : 'none';

  refreshXP();
}

function getGoalMinutes() {
  const type = $('goalTimeframe').value;
  const value = id => Number($(id).value) || 0;

  if (type === 'short') {
    return value('goalHours') * 60 + value('goalMinutes');
  }

  if (type === 'medium') {
    return value('goalDays') * 1440;
  }

  return (
    value('goalWeeks') * 10080 +
    value('goalMonths') * 43200 +
    value('goalYears') * 525600
  );

// Life OVR v2: all new activity uses timestamped, non-overlapping timed sessions.
// Older goals and their previously earned XP are preserved as legacy goals.
const DAY=86400000;
const nowISO=()=>new Date().toISOString();
const safeInt=(v,lo=0,hi=1000000)=>clamp(Math.floor(Number(v)||0),lo,hi);
const dateKey=t=>{const d=new Date(t);return Number.isNaN(d.getTime())?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const weekKey=t=>{const d=new Date(t);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return dateKey(d)};
const monthKey=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const getSessions=g=>Array.isArray(g.sessions)?g.sessions:[];
const activeMinutes=g=>getSessions(g).reduce((n,s)=>n+(Math.max(0,Number(s.seconds)||0)/60),0);
const goalSchedule=g=>g.schedule||{frequency:'weekly',count:1,weekdays:[]};
function scheduleScore(g){
 const sessions=getSessions(g),sched=goalSchedule(g);
 if(sched.frequency==='once')return sessions.length?1:0;
 if(!sessions.length)return 0;
 const created=new Date(g.createdAt||Date.now()),end=new Date(g.completedAt||Date.now());
 if(end<created)return 0;
 const dates=[...new Set(sessions.map(s=>dateKey(s.endedAt)).filter(Boolean))];
 const elapsed=Math.max(1,Math.ceil((end-created)/DAY));
 if(sched.frequency==='daily'){
   const expected=Math.max(1,elapsed*safeInt(sched.count,1,7));
   return clamp(dates.length/expected,0,1);
 }
 if(sched.frequency==='monthly'){
   const months=Math.max(1,(end.getFullYear()-created.getFullYear())*12+end.getMonth()-created.getMonth()+1);
   const counts={};sessions.forEach(s=>{const k=monthKey(s.endedAt);counts[k]=(counts[k]||0)+1});
   return clamp(Object.values(counts).reduce((n,v)=>n+Math.min(v,safeInt(sched.count,1,31)),0)/(months*safeInt(sched.count,1,31)),0,1);
 }
 const weeks=Math.max(1,Math.ceil(elapsed/7));
 const counts={};
 for(const k of dates){const d=new Date(k+'T12:00:00');if(sched.weekdays?.length&&!sched.weekdays.includes(d.getDay()))continue;const w=weekKey(d);counts[w]=(counts[w]||0)+1}
 const required=sched.weekdays?.length?sched.weekdays.length:safeInt(sched.count,1,7);
 return clamp(Object.values(counts).reduce((n,v)=>n+Math.min(v,required),0)/(weeks*required),0,1);
}
function xpForGoal(g){
 if(!g.v2)return g.xp;
 const estimate=Math.max(1,Number(g.estimatedActiveMinutes)||30);
 const actual=activeMinutes(g);
 const effort=Math.min(actual,estimate*1.25);
 const base=2.2*20*(Math.sqrt(1+effort/20)-1)*Number(g.difficulty||1);
 const score=scheduleScore(g);
 const bonus=goalSchedule(g).frequency==='once'?0:score>=.95?.2:score>=.8?.12:score>=.6?.05:0;
 return Math.max(0,Math.round(base*(1+bonus)*1.1/5)*5);
}
function maintenanceOf(a){return a.maintenance||'weekly'}
function lastActivity(a){
 const times=data.goals.filter(g=>g.attribute===a.id).flatMap(g=>getSessions(g).map(s=>s.endedAt).concat(g.done&&g.completedAt?[g.completedAt]:[]));
 const valid=times.map(t=>new Date(t).getTime()).filter(Number.isFinite);
 return valid.length?Math.max(...valid):Number(new Date(a.createdAt||Date.now()));
}
function attrCurrent(a){
 const peak=ratingInfo(a.xp).rating;
 const days=Math.max(0,(Date.now()-lastActivity(a))/DAY);
 const grace={frequent:7,weekly:14,monthly:45}[maintenanceOf(a)]||14;
 const interval={frequent:7,weekly:14,monthly:30}[maintenanceOf(a)]||14;
 const penalty=clamp(Math.floor(Math.max(0,days-grace)/interval),0,10);
 return {earned:peak,current:Math.max(50,peak-penalty),penalty,days:Math.floor(days)};
}

 if(id){const g=data.goals.find(g=>g.id===id);if(!g||g.done)return alert('Cannot edit a completed goal.');Object.assign(g,fields)}else data.goals.unshift({id:uid(),...fields,sessions:[],done:false,createdAt:nowISO()});closeModal();save();toast(id?'Goal updated':'Goal created')
}
// Refresh only the running timer display, without re-rendering the page.
setInterval(()=>{if(!currentTimer)return;const el=document.querySelector('[data-clock="'+currentTimer.goalId+'"]');if(!el)return;const sec=Math.floor(timerSeconds(currentTimer));el.textContent=[Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(v=>String(v).padStart(2,'0')).join(':')},1000);
// Handle data created before v2 without changing earned XP or legacy goal records.
for(const a of data.attributes){if(!a.createdAt)a.createdAt=nowISO();if(!a.maintenance)a.maintenance='weekly'}


// Visual-only rank styling. Does not modify stored data or progression logic.
function rankFor(r){if(r>=99)return ['max','MAX'];if(r>=95)return ['crimson','CRIMSON'];if(r>=90)return ['platinum','PLATINUM'];if(r>=80)return ['gold','GOLD'];if(r>=70)return ['silver','SILVER'];if(r>=60)return ['bronze','BRONZE'];return ['rookie','ROOKIE']}
function applyRankVisuals(){
 const hero=document.querySelector('.ovr');if(hero){const r=Number(hero.querySelector('strong')?.textContent)||50,[c,n]=rankFor(r);hero.classList.add('rank-'+c);const grow=hero.nextElementSibling;if(grow&&!grow.querySelector('.rank-badge')){const b=document.createElement('div');b.className='rank-badge rank-'+c;b.textContent=n+' RANK';grow.querySelector('h2')?.insertAdjacentElement('afterend',b)}}
 if(tab==='attributes')document.querySelectorAll('#content .goal').forEach(card=>{const candidates=[...card.querySelectorAll('b')];const rating=candidates.map(x=>Number(x.textContent.trim())).find(n=>Number.isFinite(n)&&n>=50&&n<=99);if(!rating)return;const [c,n]=rankFor(rating);card.classList.add('attribute-rank','rank-'+c);const target=candidates.find(x=>Number(x.textContent.trim())===rating);if(target)target.classList.add('attribute-rating');if(!card.querySelector('.rank-badge')){const badge=document.createElement('span');badge.className='rank-badge rank-'+c;badge.textContent=n;target?.parentElement?.appendChild(badge)}})
}
const _lifeOvrRender=render;render=function(){_lifeOvrRender();requestAnimationFrame(applyRankVisuals)};

render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
