<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1323"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Life OVR</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf4ff;background:#0b1323}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#14253d,#0b1323 45%)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{max-width:800px;margin:auto;padding:calc(24px + env(safe-area-inset-top, 0px)) 20px 8px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.13em;font-size:21px}.brand span{color:#64e5bd}.muted{color:#a7b8cf}.tiny{font-size:12px}.wrap{max-width:800px;margin:auto;padding:12px 16px 90px}.panel{background:#17263d;border:1px solid #30435c;border-radius:20px;padding:19px;margin:12px 0;box-shadow:0 8px 22px #0002}.hero{background:linear-gradient(120deg,#1c3d52,#1a2846);display:flex;gap:18px;align-items:center}.ovr{min-width:100px;text-align:center;border:2px solid #6ce8c0;border-radius:18px;padding:14px 10px;background:#102b35}.ovr strong{display:block;font-size:42px;line-height:1;color:#77f2c8}.ovr small{font-weight:800;letter-spacing:.16em}.grow{flex:1;min-width:0}.bar{height:10px;background:#31465d;border-radius:99px;overflow:hidden;margin:9px 0}.fill{height:100%;background:linear-gradient(90deg,#4bd7aa,#a1f3b6);border-radius:99px}.flex{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#101e32;border-radius:13px;padding:13px}.stat b{display:block;font-size:22px}.stat small{color:#a7b8cf}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 3px}.tab,.btn{border:1px solid #456078;background:#233952;color:#e8f3ff;border-radius:12px;padding:11px 14px;font-weight:700}.tab.active,.btn.primary{background:#62e3b9;color:#0a2630;border-color:#62e3b9}.btn.danger{background:#4b2532;border-color:#9b5063}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:default}.stack{display:grid;gap:10px}.goal{background:#122137;border:1px solid #30435c;border-radius:15px;padding:15px}.goal h3{margin:5px 0;font-size:17px}.pill{border-radius:20px;background:#2a425c;color:#c9e2fa;padding:4px 9px;font-size:11px;font-weight:800}.xp{color:#f7cc75;font-weight:800}.sub{padding:11px 0;border-bottom:1px solid #2c4057}.sub:last-child{border:0}input,select,textarea{width:100%;background:#0d1a2d;border:1px solid #496078;border-radius:11px;color:white;padding:12px;outline:none}label{display:block;color:#b8c9dd;font-size:13px;margin:12px 0 6px;font-weight:700}input[type=checkbox]{width:20px;height:20px;accent-color:#5ee0b6}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:5}.sheet{background:#192a42;border:1px solid #405875;border-radius:22px 22px 0 0;width:100%;max-width:700px;max-height:92vh;overflow:auto;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 10px}.hidden{display:none!important}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.notice{font-size:12px;color:#b5c8d8;line-height:1.5}.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 8px}.section-title h2{margin:0;font-size:19px}.empty{padding:30px 10px;text-align:center;color:#a9bdd2}.check{display:flex;align-items:center;gap:10px}.check input{flex-shrink:0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#68e7bb;color:#102e30;border-radius:12px;padding:13px 20px;font-weight:800;z-index:10;box-shadow:0 5px 30px #0008;max-width:90vw;text-align:center}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{border-radius:20px}.hero{padding:28px}}@media(max-width:380px){.ovr{min-width:85px}.ovr strong{font-size:35px}}
</style></head><body><header><div class="brand">LIFE <span>OVR</span></div><button class="btn small" onclick="openSettings()">⚙ Settings</button></header><main class="wrap"><div id="app"></div></main><div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast hidden"></div><script>
const KEY='life-ovr-v1';let data;const defaults=()=>({name:'My Player',attributes:[{id:'fitness',name:'Fitness',xp:0},{id:'career',name:'Career',xp:0},{id:'finance',name:'Finance',xp:0},{id:'family',name:'Family',xp:0},{id:'discipline',name:'Discipline',xp:0}],goals:[],history:[]});try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{data=defaults()}if(!Array.isArray(data.attributes)||!Array.isArray(data.goals)||!Array.isArray(data.history))data=defaults();let tab='goals',filter='active';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now()+Math.random()),fmt=n=>Math.round(n).toLocaleString(),save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()},sum=arr=>arr.reduce((s,x)=>s+x,0),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// The cost of each next rating rises exponentially from 50 through 99.
const cost=rating=>Math.round(100*Math.pow(1.115,rating-50));function ratingInfo(xp){let rating=50,remaining=Math.max(0,xp);while(rating<99&&remaining>=cost(rating)){remaining-=cost(rating);rating++}return{rating,remaining,needed:rating===99?0:cost(rating),percent:rating===99?100:100*remaining/cost(rating)}}
const overall=()=>Math.round(sum(data.attributes.map(a=>ratingInfo(a.xp).rating))/Math.max(1,data.attributes.length));const earned=()=>sum(data.history.filter(h=>h.type==='earn').map(h=>h.xp));const goalProgress=g=>{if(!g.steps?.length)return 0;const total=sum(g.steps.map(s=>s.xp));return total?100*sum(g.steps.filter(s=>s.done).map(s=>s.xp))/total:100};const allDone=g=>!g.steps?.length||g.steps.every(s=>s.done);const attr=id=>data.attributes.find(a=>a.id===id);function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast')?.classList.add('hidden'),2400)}function modal(html){$('sheet').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
function render(){const o=overall();$('app').innerHTML=`<div class="panel hero"><div class="ovr"><strong>${o}</strong><small>OVR</small></div><div class="grow"><div class="muted tiny">PLAYER PROFILE</div><h2 style="margin:3px 0 8px">${esc(data.name)}</h2><div class="muted tiny">Your attributes determine your overall rating</div><div class="bar"><div class="fill" style="width:${100*(o-50)/49}%"></div></div><div class="tiny muted">${o===99?'MAX OVR REACHED':`${o-50} of 49 OVR gained`}</div></div></div><div class="grid"><div class="stat"><b>${fmt(earned())}</b><small>Total XP earned</small></div><div class="stat"><b>${data.goals.filter(g=>g.done).length}</b><small>Goals completed</small></div><div class="stat"><b>${data.goals.filter(g=>!g.done).length}</b><small>Active goals</small></div><div class="stat"><b>${data.attributes.length}</b><small>Attributes</small></div></div><div class="tabs">${[['goals','🎯 Goals'],['attributes','📈 Attributes'],['history','🏆 History']].map(([id,n])=>`<button class="tab ${tab===id?'active':''}" onclick="tab='${id}';render()">${n}</button>`).join('')}</div><div id="content"></div>`;if(tab==='goals')renderGoals();if(tab==='attributes')renderAttrs();if(tab==='history')renderHistory()}
function renderGoals(){const goals=data.goals.filter(g=>filter==='all'||(filter==='active'?!g.done:g.done));$('content').innerHTML=`<div class="section-title"><h2>Your Goals</h2><button class="btn primary" onclick="openGoal()">+ New Goal</button></div><div class="tabs">${[['active','Active'],['done','Completed'],['all','All']].map(([id,n])=>`<button class="tab ${filter===id?'active':''}" onclick="filter='${id}';render()">${n}</button>`).join('')}</div><div class="stack">${goals.length?goals.map(goalCard).join(''):'<div class="panel empty">No goals here yet. Create your first goal to begin earning XP.</div>'}</div>`}
function goalCard(g){const progress=g.done?100:goalProgress(g),a=attr(g.attribute);return `<article class="goal"><div class="flex between"><span class="pill">${esc(a?.name||'Unassigned')}</span><span class="xp">${g.done?'✓ Earned':'🔒 Pending'} ${fmt(g.xp)} XP</span></div><h3>${esc(g.title)}</h3>${g.description?`<div class="muted tiny">${esc(g.description)}</div>`:''}<div class="flex between tiny muted" style="margin-top:12px"><span>${g.steps?.length?`${g.steps.filter(s=>s.done).length}/${g.steps.length} milestones`:'Single task'}</span><span>${Math.round(progress)}%</span></div><div class="bar"><div class="fill" style="width:${progress}%"></div></div>${g.steps?.length?`<div>${g.steps.map(s=>`<div class="sub"><label class="check" style="margin:0"><input type="checkbox" ${s.done?'checked':''} ${g.done?'disabled':''} onchange="toggleStep('${g.id}','${s.id}')"><span style="flex:1;${s.done?'text-decoration:line-through;color:#9cb4c6':''}">${esc(s.title)}</span><span class="xp tiny">${fmt(s.xp)} XP</span></label></div>`).join('')}</div>`:''}<div class="actions">${!g.done?`<button class="btn primary small" ${!allDone(g)?'disabled':''} onclick="finishGoal('${g.id}')">${g.steps?.length?'Claim goal XP':'Complete & earn XP'}</button><button class="btn small" onclick="openGoal('${g.id}')">Edit</button>`:''}<button class="btn small danger" onclick="deleteGoal('${g.id}')">Delete</button></div>${g.steps?.length&&!g.done?'<div class="notice">Milestones track progress only. All XP is awarded when you complete the entire goal.</div>':''}</article>`}
function toggleStep(gid,sid){const g=data.goals.find(g=>g.id===gid);if(!g||g.done)return;const s=g.steps.find(s=>s.id===sid);if(s)s.done=!s.done;save()}function finishGoal(id){const g=data.goals.find(g=>g.id===id);if(!g||g.done||!allDone(g))return;const a=attr(g.attribute);if(!a){alert('Choose an attribute before completing this goal.');return}g.done=true;g.completedAt=new Date().toISOString();a.xp+=g.xp;data.history.unshift({id:uid(),type:'earn',goalId:g.id,title:g.title,attribute:a.name,xp:g.xp,date:g.completedAt});save();toast(`+${fmt(g.xp)} XP earned!`)}function deleteGoal(id){const g=data.goals.find(g=>g.id===id);if(!g||!confirm(`Delete "${g.title}"? ${g.done?'Previously earned XP will remain on your player.':''}`))return;data.goals=data.goals.filter(x=>x.id!==id);save()}
function renderAttrs(){$('content').innerHTML=`<div class="section-title"><h2>Your Attributes</h2><button class="btn primary" onclick="openAttribute()">+ Add</button></div><div class="stack">${data.attributes.map(a=>{const p=ratingInfo(a.xp);return `<div class="goal"><div class="flex between"><div><b>${esc(a.name)}</b><div class="tiny muted">${fmt(a.xp)} total XP</div></div><div class="flex"><b style="font-size:26px;color:#76edc2">${p.rating}</b><span class="tiny muted">OVR</span></div></div><div class="bar"><div class="fill" style="width:${p.percent}%"></div></div><div class="flex between tiny muted"><span>${p.rating===99?'Maxed out':`${fmt(p.remaining)} / ${fmt(p.needed)} XP to next rating`}</span><button class="btn small" onclick="openAttribute('${a.id}')">Rename</button></div></div>`}).join('')}</div><p class="notice">Overall rating is the rounded average of all attribute ratings. Adding a new attribute starts it at 50 and may change your overall rating.</p>`}
function renderHistory(){$('content').innerHTML=`<div class="section-title"><h2>XP History</h2></div><div class="stack">${data.history.length?data.history.map(h=>`<div class="goal"><div class="flex between"><b>${esc(h.title)}</b><span class="xp">+${fmt(h.xp)} XP</span></div><div class="tiny muted">${esc(h.attribute)} • ${new Date(h.date).toLocaleDateString()}</div></div>`).join(''):'<div class="panel empty">Complete goals to start your XP history.</div>'}</div>`}
function openAttribute(id){const a=attr(id);modal(`<h2>${a?'Rename attribute':'New attribute'}</h2><form onsubmit="submitAttribute(event,'${id||''}')"><label>Attribute name</label><input id="attributeName" maxlength="35" required value="${esc(a?.name||'')}" placeholder="e.g. Learning"><div class="actions"><button class="btn primary" type="submit">Save attribute</button><button class="btn" type="button" onclick="closeModal()">Cancel</button>${a?`<button class="btn danger" type="button" onclick="removeAttribute('${a.id}')">Delete</button>`:''}</div></form>`)}function submitAttribute(e,id){e.preventDefault();const name=$('attributeName').value.trim();if(!name)return;if(id)attr(id).name=name;else data.attributes.push({id:uid(),name,xp:0});closeModal();save()}function removeAttribute(id){if(data.attributes.length<=1)return alert('Keep at least one attribute.');if(data.goals.some(g=>g.attribute===id))return alert('Move or delete goals assigned to this attribute first.');if(!confirm('Delete this attribute and its XP?'))return;data.attributes=data.attributes.filter(a=>a.id!==id);closeModal();save()}
let draftSteps=[];function estimatedXP(minutes,difficulty){return Math.max(5,Math.round((10+15*Math.pow(Math.max(1,minutes)/10,.75))*difficulty/5)*5)}function openGoal(id){if(!data.attributes.length)return alert('Create an attribute first.');const g=data.goals.find(x=>x.id===id);draftSteps=(g?.steps||[]).map(s=>({...s}));modal(`<h2>${g?'Edit goal':'Create a goal'}</h2><form onsubmit="submitGoal(event,'${id||''}')"><label>Goal name</label><input id="goalTitle" maxlength="110" required value="${esc(g?.title||'')}" placeholder="What do you want to accomplish?"><label>Description (optional)</label><textarea id="goalDescription" rows="2" maxlength="500" placeholder="Why does this matter?">${esc(g?.description||'')}</textarea><label>Attribute to improve</label><select id="goalAttribute">${data.attributes.map(a=>`<option value="${esc(a.id)}" ${g?.attribute===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select><div class="grid"><div> <label>Timeframe</label> <select id="goalTimeframe" onchange="changeTimeframe()">   <option value="short">Short</option>   <option value="medium">Medium</option>   <option value="long">Long</option> </select>  <div id="shortFields">   <label>Hours</label>   <input id="goalHours" type="number" min="0" value="0" oninput="refreshXP()">   <label>Minutes</label>   <input id="goalMinutes" type="number" min="0" value="${g?.minutes||30}" oninput="refreshXP()"> </div>  <div id="mediumFields" style="display:none">   <label>Days</label>   <input id="goalDays" type="number" min="0" value="0" oninput="refreshXP()"> </div>  <div id="longFields" style="display:none">   <label>Weeks</label>   <input id="goalWeeks" type="number" min="0" value="0" oninput="refreshXP()">   <label>Months</label>   <input id="goalMonths" type="number" min="0" value="0" oninput="refreshXP()">   <label>Years</label>   <input id="goalYears" type="number" min="0" value="0" oninput="refreshXP()"> </div></div><div><label>Difficulty</label><select id="goalDifficulty" onchange="refreshXP()"><option value="0.75" ${g?.difficulty===.75?'selected':''}>Easy</option><option value="1" ${!g||g.difficulty===1?'selected':''}>Normal</option><option value="1.5" ${g?.difficulty===1.5?'selected':''}>Hard</option><option value="2" ${g?.difficulty===2?'selected':''}>Very hard</option></select></div></div><label>Total XP reward (editable)</label><input id="goalXP" type="number" min="1" max="10000000" required value="${g?.xp||estimatedXP(30,1)}" oninput="refreshSteps()"><div class="notice">XP is suggested from estimated time and difficulty. You can override it. For big goals, enter the total time for the whole project.</div><div class="section-title"><h2>Optional milestones</h2><button class="btn small" type="button" onclick="addStep()">+ Add milestone</button></div><div id="stepList"></div><div class="notice" id="stepHint"></div><div class="actions"><button class="btn primary" type="submit">${g?'Save changes':'Create goal'}</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`);refreshSteps()}

function changeTimeframe() {
  const type = $('goalTimeframe').value;

  $('shortFields').style.display = type === 'short' ? 'block' : 'none';
  $('mediumFields').style.display = type === 'medium' ? 'block' : 'none';
  $('longFields').style.display = type === 'long' ? 'block' : 'none';

  refreshXP();
}

function getGoalMinutes() {
  const type = $('goalTimeframe').value;
  const value = id => Number($(id).value) || 0;

  if (type === 'short') {
    return value('goalHours') * 60 + value('goalMinutes');
  }

  if (type === 'medium') {
    return value('goalDays') * 1440;
  }

  return (
    value('goalWeeks') * 10080 +
    value('goalMonths') * 43200 +
    value('goalYears') * 525600
  );
}
function refreshXP(){$('goalXP').value=estimatedXP(Number($('goalMinutes').value)||1,Number($('goalDifficulty').value)||1);refreshSteps()}function addStep(){draftSteps.push({id:uid(),title:'',xp:0,done:false});if(draftSteps.length===1)draftSteps[0].xp=Number($('goalXP').value)||0;refreshSteps()}function removeStep(i){draftSteps.splice(i,1);refreshSteps()}function setStep(i,key,value){draftSteps[i][key]=key==='xp'?Math.max(0,Number(value)||0):value;updateStepHint()}function refreshSteps(){$('stepList').innerHTML=draftSteps.map((s,i)=>`<div class="goal" style="margin:8px 0"><div class="flex"><div class="grow"><label>Milestone ${i+1}</label><input value="${esc(s.title)}" placeholder="Milestone name" oninput="setStep(${i},'title',this.value)"></div><div style="width:105px"><label>XP share</label><input type="number" min="0" value="${s.xp}" oninput="setStep(${i},'xp',this.value)"></div><button type="button" class="btn small danger" style="align-self:end" onclick="removeStep(${i})">×</button></div>${s.done?'<div class="tiny muted">✓ Already completed</div>':''}</div>`).join('');updateStepHint()}function updateStepHint(){const total=Number($('goalXP').value)||0,assigned=sum(draftSteps.map(s=>s.xp));$('stepHint').textContent=draftSteps.length?`${fmt(assigned)} of ${fmt(total)} XP allocated across milestones. ${assigned===total?'✓ Balanced':'These must match before saving.'}`:'No milestones: earn the reward when you complete this goal.';$('stepHint').style.color=assigned===total?'#78eac0':'#f7cc75'}
function submitGoal(e,id){e.preventDefault();const title=$('goalTitle').value.trim(),xp=Number($('goalXP').value),minutes=Number($('goalMinutes').value),difficulty=Number($('goalDifficulty').value);if(!title||!Number.isFinite(xp)||xp<1||!Number.isFinite(minutes)||minutes<1)return alert('Enter a valid title, duration, and XP reward.');if(draftSteps.some(s=>!s.title.trim()))return alert('Give every milestone a name.');if(draftSteps.length&&sum(draftSteps.map(s=>s.xp))!==xp)return alert('Milestone XP shares must add up exactly to the total goal XP.');const fields={title,description:$('goalDescription').value.trim(),attribute:$('goalAttribute').value,minutes,difficulty,xp,steps:draftSteps.map(s=>({...s,title:s.title.trim()}))};if(id){const g=data.goals.find(g=>g.id===id);Object.assign(g,fields)}else data.goals.unshift({id:uid(),...fields,done:false,createdAt:new Date().toISOString()});closeModal();save();toast(id?'Goal updated':'Goal created')}
function openSettings(){modal(`<h2>Settings</h2><label>Player name</label><input id="playerName" maxlength="40" value="${esc(data.name)}"><div class="actions"><button class="btn primary" onclick="data.name=$('playerName').value.trim()||'My Player';closeModal();save()">Save name</button></div><hr style="border-color:#344b62;margin:22px 0"><h3>Back up your progress</h3><p class="notice">Your data is stored in this browser on this device. Export a backup regularly. Clearing website data or changing devices may erase your progress.</p><div class="actions"><button class="btn" onclick="exportData()">⬇ Export backup</button><button class="btn" onclick="$('importFile').click()">⬆ Import backup</button><input class="hidden" type="file" id="importFile" accept="application/json,.json" onchange="importData(event)"></div><hr style="border-color:#344b62;margin:22px 0"><p class="notice">Version 1 • Offline-capable after installation • All XP is awarded only when the parent goal is completed. XP from completed goals is retained even if you later delete their records.</p><button class="btn" onclick="closeModal()">Close</button>`)}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='life-ovr-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){const file=e.target.files?.[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.attributes)||!Array.isArray(incoming.goals)||!Array.isArray(incoming.history))throw Error('Invalid backup');if(!confirm('Replace all current progress with this backup?'))return;data=incoming;closeModal();save();toast('Backup restored')}catch(err){alert('Could not import backup: '+err.message)}}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
